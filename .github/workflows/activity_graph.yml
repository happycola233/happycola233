name: Generate Activity Graph

on:
  # 北京时间每天 00:00 = UTC 16:00
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Activity Graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate activity graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRAPH_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/generate_activity_graph.py

      - name: Commit & Push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add activity-graph/graph.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update activity graph"
          git pull --rebase origin main
          git push origin main
